{% extends 'base.html' %}

{% block title %}Greeting Page{% endblock %}

{% block content %}
<div class="row">
    <aside class="col-md-3 mb-4">
        <div class="list-group shadow-sm">
            <a href="{{ url_for('users.greetings', name='John', age=30) }}" class="list-group-item list-group-item-action">Greet John</a>
            <a href="{{ url_for('users.admin') }}" class="list-group-item list-group-item-action">Admin</a>
        </div>
    </aside>

    <main class="col-md-9">
        <div class="card p-4 shadow-sm">
            <h2 class="display-6">Hello :)</h2>
            <p class="fs-4 mb-1"><strong>User:</strong> {{ name }}</p>
            {% if age %}
                <p class="text-success fs-5"><strong>Age:</strong> {{ age }}</p>
            {% else %}
                <p class="text-danger fs-5"><strong>Age:</strong> Not provided</p>
            {% endif %}
        </div>
    </main>
</div>
{% endblock %}
