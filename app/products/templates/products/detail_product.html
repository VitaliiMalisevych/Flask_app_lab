{% extends 'base.html' %}

{% block content %}
<div class="card p-4 shadow-sm mx-auto" style="max-width: 600px;">
    <h2 class="text-primary">{{ product.name }}</h2>
    <h4 class="text-success mb-3">Ціна: ${{ product.price }}</h4>
    <p class="lead">{{ product.content }}</p>
    <hr>
    <a href="{{ url_for('products.list_products') }}" class="btn btn-secondary">← Назад до списку</a>
</div>
{% endblock %}
