{% extends "base.html" %}
{% block title %}Мій акаунт{% endblock %}
{% block content %}
<div class="card shadow-sm"><div class="card-body p-4">
    <h2>Вітаємо, {{ user.username }}!</h2>
    <p>Email: {{ user.email }}</p>
    <a class="btn btn-primary" href="{{ url_for('users.profile') }}">Керування cookies</a>
    <a class="btn btn-outline-primary" href="{{ url_for('users.users_list') }}">Список користувачів</a>
    <a class="btn btn-outline-danger" href="{{ url_for('users.logout') }}">Вийти</a>
</div></div>
{% endblock %}
