
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="{{ url_for('main.home') }}">
            WebPython
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Відкрити меню">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'main.home' %}active{% endif %}"
                       href="{{ url_for('main.home') }}">
                        Головна
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'main.resume' %}active{% endif %}"
                       href="{{ url_for('main.resume') }}">
                        Резюме
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'main.contact' %}active{% endif %}"
                       href="{{ url_for('main.contact') }}">
                        Контакти
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint and request.endpoint.startswith('products.') %}active{% endif %}"
                       href="{{ url_for('products.list_products') }}">
                        Товари
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint and request.endpoint.startswith('post.') %}active{% endif %}"
                       href="{{ url_for('post.all_posts') }}">
                        Пости
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'users.profile' %}active{% endif %}"
                       href="{{ url_for('users.profile') }}">
                        Профіль
                    </a>
                </li>

            </ul>

            <ul class="navbar-nav ms-auto align-items-lg-center">

                {% if session.get('username') %}

                    <li class="nav-item">
                        <span class="nav-link text-light">
                            Вітаємо, {{ session['username'] }}!
                        </span>
                    </li>

                    <li class="nav-item ms-lg-2">
                        <a class="btn btn-outline-danger btn-sm"
                           href="{{ url_for('users.logout') }}">
                            Вийти
                        </a>
                    </li>

                {% else %}

                    <li class="nav-item">
                        <a class="nav-link"
                           href="{{ url_for('users.login') }}">
                            Увійти
                        </a>
                    </li>

                {% endif %}

            </ul>

        </div>
    </div>
</nav>
